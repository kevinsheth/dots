after-startup-command = [
  'exec-and-forget ~/.config/borders/bordersrc',
  'exec-and-forget ~/.config/wallpapers/set-wallpaper.sh',
  'exec-and-forget sketchybar',
]
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]
start-at-login = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 10
outer.bottom = 12
outer.top = 46
outer.right = 10

[mode.main.binding]
cmd-enter = 'exec-and-forget open -na "Ghostty"'
cmd-shift-enter = 'exec-and-forget open -na "Brave Browser"'
cmd-shift-n = 'exec-and-forget open -na "Brave Browser"'
cmd-shift-m = 'exec-and-forget open -a "Music"'
cmd-shift-g = "exec-and-forget osascript -e 'tell application \"Google Chrome\" to open location \"https://github.com\"' -e 'tell application \"Google Chrome\" to activate'"
cmd-shift-s = "exec-and-forget osascript -e 'tell application \"Google Chrome\" to open location \"https://app.shortcut.com\"' -e 'tell application \"Google Chrome\" to activate'"
cmd-space = 'exec-and-forget open -a "Raycast"'
cmd-ctrl-b = 'exec-and-forget open "x-apple.systempreferences:com.apple.BluetoothSettings"'
cmd-slash = 'layout tiles horizontal vertical'
cmd-comma = 'layout accordion horizontal vertical'
cmd-t = 'layout tiling'
cmd-f = 'fullscreen'
cmd-w = 'close'
cmd-q = 'close'

cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'

cmd-ctrl-h = 'resize width -70'
cmd-ctrl-j = 'resize height +70'
cmd-ctrl-k = 'resize height -70'
cmd-ctrl-l = 'resize width +70'
cmd-minus = 'resize smart -60'
cmd-equal = 'resize smart +60'
cmd-shift-equal = 'resize smart +60'

cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 10'

cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 10'

cmd-tab = 'workspace-back-and-forth'
cmd-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
cmd-shift-h = ['join-with left', 'mode main']
cmd-shift-j = ['join-with down', 'mode main']
cmd-shift-k = ['join-with up', 'mode main']
cmd-shift-l = ['join-with right', 'mode main']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['layout tiling']

[[on-window-detected]]
if.app-id = 'com.electron.kumospace'
run = ['layout tiling']
